services:
  app:
    build: .
    env_file:
      - .env
    volumes:
      - ./:/app
      - /app/venv
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - epiccsafe

  caddy:
    image: caddy:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - epiccsafe

networks:
  epiccsafe:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
